services:
  - type: web
    name: arnix-lampac
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /version?type=hash
    autoDeploy: true
    envVars:
      - key: ALLOHA_TOKEN
        sync: false
      - key: ALLOHA_SECRET_TOKEN
        sync: false
